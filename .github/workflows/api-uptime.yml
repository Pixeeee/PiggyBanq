name: API uptime

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: api-uptime
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render API health
        shell: bash
        run: |
          status=$(curl --silent --show-error --fail \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 5 --retry-max-time 240 \
            --output /dev/null --write-out '%{http_code}' \
            https://piggybanq-api.onrender.com/health)
          test "$status" = 200
          echo 'Render API health check passed (HTTP 200).'
