name: CI

on:
  push:
    branches: [main, kim]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piggybanq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piggybanq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/piggybanq_test?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/piggybanq_test?sslmode=disable
      AUTH_RATE_LIMIT_MAX: 1000
      API_BASE_URL: http://127.0.0.1:4000
      STELLAR_NETWORK: TESTNET
      AUTH_ALLOWED_STELLAR_NETWORKS: TESTNET
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3010
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piggybanq/server exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @piggybanq/server exec prisma validate --schema prisma/schema.prisma
      - run: pnpm --filter @piggybanq/server exec prisma generate --schema prisma/schema.prisma
      - run: pnpm test
      - run: pnpm -r build
      - name: Database release integration
        run: |
          pnpm --filter @piggybanq/server start > /tmp/piggybanq-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:4000/ready && break; sleep 1; done
          RUN_DATABASE_RELEASE_TESTS=1 node --test tests/release-api.test.mjs
      - name: Browser release integration
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm --filter @piggybanq/web start --port 3010 > /tmp/piggybanq-web.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:3010/login && break; sleep 1; done
          node tests/release-browser.mjs
      - name: Audit production dependencies
        run: >-
          pnpm audit --prod --audit-level high
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-vfj7-8cjw-p6xm
        # Four isolated Expo/Metro build-tool exceptions: docs/DEPENDENCY-SECURITY.md.
